name: Python兼容性与桥接离线测试

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装测试依赖
        # 不安装仅适用于Windows的终端依赖，不连接真实账户。
        run: python -m pip install "akshare>=1.18.94" "numpy>=1.26.4" "pandas>=2.2.2" "scipy>=1.12" "numexpr>=2.10.2" "bottleneck>=1.4.2" requests beautifulsoup4
      - name: 执行单元测试与导出模板隔离测试
        run: python -m unittest discover -s tests -v
